<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Synastry Reading</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Cinzel:wght@400;600&display=swap');

:root {
--gold: #c9a84c; --gold-light: #e8d49a;
--deep: #0a0812; --vellum: #f5f0e8;
--crimson: #8b2635; --indigo: #2d2b6b;
}

* { margin:0; padding:0; box-sizing:border-box; }
  body { background:var(--deep); color:var(--vellum); font-family:'Cormorant Garamond',serif; min-height:100vh; overflow-x:hidden; }

.starfield { position:fixed; top:0; left:0; width:100%; height:100%; pointer-events:none; z-index:0;
background:radial-gradient(ellipse at 20% 30%,#1a1040 0%,transparent 60%),radial-gradient(ellipse at 80% 70%,#0d1a2e 0%,transparent 60%),var(--deep); }
.star { position:absolute; background:white; border-radius:50%; animation:twinkle var(--d,3s) ease-in-out infinite alternate; }
@keyframes twinkle { from{opacity:0.2} to{opacity:0.9} }

.container { position:relative; z-index:1; max-width:900px; margin:0 auto; padding:3rem 2rem; }

header { text-align:center; margin-bottom:2rem; border-bottom:1px solid rgba(201,168,76,0.3); padding-bottom:2rem; }
.eyebrow { font-family:'Cinzel',serif; font-size:0.65rem; letter-spacing:0.3em; color:var(--gold); text-transform:uppercase; margin-bottom:1rem; }
h1 { font-family:'Cinzel',serif; font-size:clamp(1.6rem,4vw,2.4rem); font-weight:600; color:var(--gold-light); line-height:1.2; margin-bottom:0.5rem; }
.subtitle { font-style:italic; font-size:1.05rem; color:rgba(245,240,232,0.6); }

/* ── BIRTH PANEL ── */
.birth-panel {
border:1px solid rgba(201,168,76,0.3);
margin-bottom:2.5rem;
background:rgba(0,0,0,0.2);
}
.birth-panel-header {
display:flex;justify-content:space-between;align-items:center;
padding:1rem 1.8rem;cursor:pointer;user-select:none;
}
.birth-panel-header:hover{background:rgba(201,168,76,0.04);}
.birth-panel-title {
font-family:'Cinzel',serif;font-size:0.6rem;letter-spacing:0.25em;
color:var(--gold);text-transform:uppercase;
}
.birth-panel-toggle{font-size:0.7rem;color:rgba(245,240,232,0.4);}
.birth-panel-body{padding:1.2rem 1.8rem 1.6rem;border-top:1px solid rgba(201,168,76,0.15);}
.birth-person{margin-bottom:1.4rem;}
.birth-person:last-child{margin-bottom:0;}
.birth-person-label{
font-family:'Cinzel',serif;font-size:0.58rem;letter-spacing:0.2em;
color:var(--gold);text-transform:uppercase;margin-bottom:0.7rem;
}
.birth-row{display:flex;flex-wrap:wrap;gap:0.5rem 0.8rem;align-items:center;}
.birth-field{display:flex;flex-direction:column;gap:0.2rem;}
.birth-field label{font-size:0.7rem;color:rgba(245,240,232,0.4);font-family:'Cinzel',serif;letter-spacing:0.1em;}
.birth-input {
background:rgba(255,255,255,0.05);
border:1px solid rgba(201,168,76,0.25);
color:var(--vellum);
font-family:'Cormorant Garamond',serif;
font-size:0.95rem;
padding:0.3rem 0.5rem;
border-radius:2px;
width:100%;
}
.birth-input:focus{outline:none;border-color:rgba(201,168,76,0.6);background:rgba(201,168,76,0.06);}
.birth-input-sm{width:4rem;}
.birth-input-md{width:5.5rem;}
.birth-input-lg{width:9rem;}
.birth-submit{
font-family:'Cinzel',serif;font-size:0.62rem;letter-spacing:0.15em;
text-transform:uppercase;padding:0.5rem 1.2rem;
background:rgba(201,168,76,0.15);border:1px solid var(--gold);
color:var(--gold-light);cursor:pointer;margin-top:1rem;
transition:background 0.2s;
}
.birth-submit:hover{background:rgba(201,168,76,0.28);}
.birth-gender-btn {
font-family:'Cinzel',serif;font-size:0.58rem;letter-spacing:0.12em;
padding:0.3rem 0.7rem;cursor:pointer;border:none;background:transparent;
color:rgba(245,240,232,0.45);transition:all 0.2s;
}
.birth-gender-btn:hover{color:rgba(245,240,232,0.8);background:rgba(201,168,76,0.08);}
.birth-gender-btn.active{background:rgba(201,168,76,0.2);color:var(--gold-light);}
.birth-note{font-size:0.78rem;font-style:italic;color:rgba(245,240,232,0.35);margin-top:0.5rem;}
.tone-panel {
border:1px solid rgba(201,168,76,0.3);
padding:1.4rem 1.8rem;
margin-bottom:2.5rem;
background:rgba(0,0,0,0.25);
}
.tone-panel-title {
font-family:'Cinzel',serif; font-size:0.6rem; letter-spacing:0.25em;
color:var(--gold); text-transform:uppercase; margin-bottom:1.2rem;
}
.tone-row {
display:flex; align-items:center; justify-content:space-between;
margin-bottom:0.9rem; flex-wrap:wrap; gap:0.5rem;
}
.tone-row:last-child { margin-bottom:0; }
.tone-question { font-size:0.9rem; font-style:italic; color:rgba(245,240,232,0.65); flex:1; min-width:160px; }
.tone-toggle {
display:flex; border:1px solid rgba(201,168,76,0.3); border-radius:2px; overflow:hidden;
}
.tone-btn {
font-family:'Cinzel',serif; font-size:0.6rem; letter-spacing:0.12em;
padding:0.35rem 0.9rem; cursor:pointer; border:none; background:transparent;
color:rgba(245,240,232,0.45); transition:all 0.2s; white-space:nowrap;
}
.tone-btn:hover { color:rgba(245,240,232,0.8); background:rgba(201,168,76,0.08); }
.tone-btn.active { background:rgba(201,168,76,0.2); color:var(--gold-light); }
.tone-sep { width:1px; background:rgba(201,168,76,0.3); }

/* ── MOMENT BOX ── */
.moment-box { background:linear-gradient(135deg,rgba(45,43,107,0.4),rgba(139,38,53,0.2)); border:1px solid var(--gold); padding:1.8rem 2rem; margin-bottom:2.5rem; position:relative; overflow:hidden; }
.moment-box::before { content:''; position:absolute; top:0; left:0; right:0; height:2px; background:linear-gradient(90deg,transparent,var(--gold),transparent); }
.moment-label { font-family:'Cinzel',serif; font-size:0.6rem; letter-spacing:0.25em; color:var(--gold); text-transform:uppercase; margin-bottom:0.5rem; }
.moment-date { font-size:1.5rem; font-weight:300; color:var(--gold-light); letter-spacing:0.05em; }
.moment-sub { font-style:italic; font-size:0.95rem; color:rgba(245,240,232,0.55); margin-top:0.3rem; }
.quality-bar { display:flex; gap:0.5rem; align-items:center; margin-top:1rem; flex-wrap:wrap; }
.quality-tag { font-family:'Cinzel',serif; font-size:0.6rem; letter-spacing:0.15em; border:1px solid; padding:0.2rem 0.6rem; }
.tag-fire { border-color:#c0392b; color:#e57373; }
.tag-water { border-color:#2980b9; color:#64b5f6; }
.tag-earth { border-color:#8e6b3e; color:#bcaaa4; }

/* ── SCORE PANEL ── */
.score-panel { background:rgba(0,0,0,0.3); border:1px solid rgba(201,168,76,0.25); margin-bottom:2.5rem; }
.score-header { display:flex; justify-content:space-between; align-items:center; padding:1rem 1.5rem; border-bottom:1px solid rgba(201,168,76,0.15); cursor:pointer; user-select:none; }
.score-header:hover { background:rgba(201,168,76,0.05); }
.score-title { font-family:'Cinzel',serif; font-size:0.7rem; letter-spacing:0.25em; color:var(--gold); text-transform:uppercase; }
.score-total { font-family:'Cinzel',serif; font-size:1.3rem; color:var(--gold-light); }
.score-toggle { font-size:0.7rem; color:rgba(245,240,232,0.4); margin-left:1rem; }
.score-body { padding:0 1.5rem 1.5rem; }
.gauge-wrap { padding:1.2rem 0 1rem; }
.gauge-track { height:6px; background:rgba(255,255,255,0.08); border-radius:3px; overflow:hidden; margin-bottom:0.4rem; }
.gauge-fill { height:100%; border-radius:3px; background:linear-gradient(90deg,#2d2b6b,#c9a84c,#8b2635); transition:width 0.5s ease; }
.gauge-labels { display:flex; justify-content:space-between; font-size:0.72rem; color:rgba(245,240,232,0.35); font-family:'Cinzel',serif; }
.score-categories { margin-top:1rem; }
.score-cat { margin-bottom:1.2rem; }
.cat-label { font-family:'Cinzel',serif; font-size:0.6rem; letter-spacing:0.2em; color:var(--gold); text-transform:uppercase; margin-bottom:0.5rem; display:flex; justify-content:space-between; align-items:center; }
.cat-pts { font-size:0.9rem; color:var(--gold-light); }
.score-item { display:grid; grid-template-columns:1fr 80px auto; gap:0.3rem 0.8rem; align-items:center; padding:0.3rem 0; border-bottom:1px solid rgba(245,240,232,0.05); font-size:0.88rem; }
.si-label { color:rgba(245,240,232,0.75); }
.si-rationale { font-style:italic; font-size:0.78rem; color:rgba(245,240,232,0.38); grid-column:1; padding-bottom:0.3rem; }
.si-pts { font-family:'Cinzel',serif; font-size:0.85rem; text-align:right; }
.si-pts.pos { color:#81c784; } .si-pts.neg { color:#ef9a9a; } .si-pts.zero { color:rgba(245,240,232,0.25); }
.si-bar-track { height:3px; background:rgba(255,255,255,0.07); border-radius:2px; }
.si-bar-fill { height:100%; border-radius:2px; }

/* ── SECTIONS ── */
.section { margin-bottom:2.5rem; }
.section-title { font-family:'Cinzel',serif; font-size:0.7rem; letter-spacing:0.25em; color:var(--gold); text-transform:uppercase; border-bottom:1px solid rgba(201,168,76,0.2); padding-bottom:0.5rem; margin-bottom:1.2rem; }
.aspect-row { display:grid; grid-template-columns:1fr auto 1fr auto; gap:0.4rem 1rem; align-items:center; padding:0.7rem 0; border-bottom:1px solid rgba(245,240,232,0.06); }
.planet-cell { font-size:1.05rem; }
.planet-name { color:var(--gold-light); font-weight:600; }
.planet-pos { font-style:italic; font-size:0.85rem; color:rgba(245,240,232,0.5); }
.aspect-glyph { font-size:1.1rem; text-align:center; min-width:2rem; }
.orb-badge { font-family:'Cinzel',serif; font-size:0.65rem; background:rgba(201,168,76,0.12); border:1px solid rgba(201,168,76,0.3); padding:0.15rem 0.4rem; border-radius:2px; color:var(--gold); }
.house-grid { display:grid; grid-template-columns:1fr 1fr; gap:1rem; }
.house-card { background:rgba(255,255,255,0.03); border:1px solid rgba(201,168,76,0.15); padding:1rem 1.2rem; border-radius:2px; }
.house-num { font-family:'Cinzel',serif; font-size:0.6rem; letter-spacing:0.2em; color:var(--gold); margin-bottom:0.3rem; }
.house-desc { font-size:0.95rem; line-height:1.6; }
.natal-grid { display:grid; grid-template-columns:1fr 1fr; gap:0.5rem 2rem; }
.natal-item { display:flex; justify-content:space-between; align-items:baseline; padding:0.35rem 0; border-bottom:1px solid rgba(245,240,232,0.06); font-size:0.95rem; }
.natal-planet { color:var(--gold-light); } .natal-sign { font-style:italic; color:rgba(245,240,232,0.6); }
.verdict { background:linear-gradient(135deg,rgba(139,38,53,0.25),rgba(45,43,107,0.35)); border:1px solid var(--gold); padding:2rem; text-align:center; position:relative; overflow:hidden; }
.verdict::after { content:'✦'; position:absolute; font-size:6rem; opacity:0.04; top:50%; left:50%; transform:translate(-50%,-50%); color:var(--gold); }
.verdict-title { font-family:'Cinzel',serif; font-size:1.1rem; letter-spacing:0.1em; color:var(--gold); margin-bottom:0.8rem; }
.verdict-text { font-style:italic; font-size:1.15rem; line-height:1.7; color:var(--gold-light); }
.divider { text-align:center; color:var(--gold); opacity:0.4; font-size:0.8rem; letter-spacing:0.5em; margin:2rem 0; }
@keyframes fadeIn { from{opacity:0;transform:translateY(10px)} to{opacity:1;transform:translateY(0)} }
.section,.score-panel,.moment-box,.tone-panel { animation:fadeIn 0.5s ease both; }
</style>

</head>
<body>
<div class="starfield" id="starfield"></div>
<div class="container" id="app">
  <div style="text-align:center;padding:4rem;font-style:italic;color:rgba(245,240,232,0.4)">Computing celestial positions…</div>
</div>
<div class="container" id="charts" style="padding-top:0"></div>

<script>
// ═══════════════════════════════════════════════════════════════
// ASTRONOMY ENGINE
// ═══════════════════════════════════════════════════════════════
const DEG=Math.PI/180, RAD=180/Math.PI;
const SIGNS=['Aries','Taurus','Gemini','Cancer','Leo','Virgo','Libra','Scorpio','Sagittarius','Capricorn','Aquarius','Pisces'];
function mod360(x){return((x%360)+360)%360;}
function toRad(d){return d*DEG;}
function toDeg(r){return r*RAD;}
function jdn(year,month,day,hour=0,min=0){const D=day+(hour+min/60)/24,A=Math.floor(year/100),B=2-A+Math.floor(A/4);return Math.floor(365.25*(year+4716))+Math.floor(30.6001*(month+1))+D+B-1524.5;}
function julianCenturies(jd){return(jd-2451545)/36525;}
function sunLongitude(T){const L0=mod360(280.46646+36000.76983*T),M=mod360(357.52911+35999.05029*T),mr=toRad(M),C=(1.914602-0.004817*T)*Math.sin(mr)+(0.019993-0.000101*T)*Math.sin(2*mr),om=mod360(125.04-1934.136*T);return mod360(L0+C-0.00569-0.00478*Math.sin(toRad(om)));}
function moonLongitude(T){const T2=T*T,T3=T2*T,T4=T3*T,D=mod360(297.8502+445267.1115*T-0.00163*T2+T3/545868-T4/113065000),M=mod360(357.5291+35999.0503*T-0.0001559*T2),Mp=mod360(134.9634+477198.8676*T+0.008997*T2+T3/69699-T4/14712000),F=mod360(93.2721+483202.0175*T-0.0034029*T2),L=mod360(218.3165+481267.8813*T),Dr=toRad(D),Mr=toRad(M),Mpr=toRad(Mp),Fr=toRad(F);let lon=L;const terms=[[6.288774,Mpr],[1.274027,2*Dr-Mpr],[0.658314,2*Dr],[0.213618,2*Mpr],[-0.185116,Mr],[-0.114332,2*Fr],[0.058793,2*Dr-2*Mpr],[0.057066,2*Dr-Mr-Mpr],[0.053322,2*Dr+Mpr],[0.045758,2*Dr-Mr],[-0.040923,Mr-Mpr],[-0.034720,Dr],[-0.030383,Mr+Mpr],[0.015327,2*Dr-2*Fr],[-0.012528,2*Fr+Mpr],[-0.010980,2*Fr-Mpr],[0.010675,4*Dr-Mpr],[0.010034,3*Mpr],[0.008548,4*Dr-2*Mpr],[-0.007888,2*Dr+Mr-Mpr],[-0.006766,2*Dr+Mr],[-0.005163,Dr-Mpr],[0.004987,Dr+Mr],[0.004036,2*Dr-Mr+Mpr],[0.003994,2*Dr+2*Mpr],[0.003861,4*Dr],[0.003665,2*Dr-3*Mpr],[-0.002689,Mr-2*Mpr],[-0.002602,2*Dr-2*Fr+Mpr]];for(const[a,angle]of terms)lon+=a*Math.sin(angle);return mod360(lon);}
// ── Geocentric ephemeris — JPL approximate Keplerian elements (Standish),
// valid 1800–2050. Heliocentric positions for the planet and for Earth are
// computed from osculating elements, then differenced to give the geocentric
// ecliptic longitude astrology actually uses — so retrogrades are real.
const KEPLER_ELEMENTS={
  // [a, aDot, e, eDot, I, IDot, L, LDot, peri, periDot, node, nodeDot]
  Mercury:[0.38709927,0.00000037,0.20563593,0.00001906,7.00497902,-0.00594749,252.25032350,149472.67411175,77.45779628,0.16047689,48.33076593,-0.12534081],
  Venus:[0.72333566,0.00000390,0.00677672,-0.00004107,3.39467605,-0.00078890,181.97909950,58517.81538729,131.60246718,0.00268329,76.67984255,-0.27769418],
  Earth:[1.00000261,0.00000562,0.01671123,-0.00004392,-0.00001531,-0.01294668,100.46457166,35999.37244981,102.93768193,0.32327364,0,0],
  Mars:[1.52371034,0.00001847,0.09339410,0.00007882,1.84969142,-0.00813131,-4.55343205,19140.30268499,-23.94362959,0.44441088,49.55953891,-0.29257343],
  Jupiter:[5.20288700,-0.00011607,0.04838624,-0.00013253,1.30439695,-0.00183714,34.39644051,3034.74612775,14.72847983,0.21252668,100.47390909,0.20469106],
  Saturn:[9.53667594,-0.00125060,0.05386179,-0.00050991,2.48599187,0.00193609,49.95424423,1222.49362201,92.59887831,-0.41897216,113.66242448,-0.28867794],
  Uranus:[19.18916464,-0.00196176,0.04725744,-0.00004397,0.77263783,-0.00242939,313.23810451,428.48202785,170.95427630,0.40805281,74.01692503,0.04240589],
  Neptune:[30.06992276,0.00026291,0.00859048,0.00005105,1.77004347,0.00035372,-55.12002969,218.45945325,44.96476227,-0.32241464,131.78422574,-0.00508664],
  Pluto:[39.48211675,-0.00031596,0.24882730,0.00005170,17.14001206,0.00004818,238.92903833,145.20780515,224.06891629,-0.04062942,110.30393684,-0.01183482],
};
function keplerE(Mdeg,e){let M=toRad(mod360(Mdeg)),E=M+e*Math.sin(M);for(let i=0;i<12;i++){const dE=(M-(E-e*Math.sin(E)))/(1-e*Math.cos(E));E+=dE;if(Math.abs(dE)<1e-9)break;}return E;}
function heliocentricXYZ(name,T){
  const el=KEPLER_ELEMENTS[name];
  const a=el[0]+el[1]*T, e=el[2]+el[3]*T, I=toRad(el[4]+el[5]*T),
        L=el[6]+el[7]*T, peri=el[8]+el[9]*T, node=toRad(el[10]+el[11]*T);
  const w=toRad(peri)-node, E=keplerE(L-peri,e);
  const xp=a*(Math.cos(E)-e), yp=a*Math.sqrt(1-e*e)*Math.sin(E);
  const cw=Math.cos(w),sw=Math.sin(w),cn=Math.cos(node),sn=Math.sin(node),ci=Math.cos(I),si=Math.sin(I);
  return {x:(cw*cn-sw*sn*ci)*xp+(-sw*cn-cw*sn*ci)*yp,
          y:(cw*sn+sw*cn*ci)*xp+(-sw*sn+cw*cn*ci)*yp,
          z:sw*si*xp+cw*si*yp};
}
// Standish elements are referenced to the J2000 ecliptic; tropical astrology
// wants equinox-of-date, so precession in longitude is added back.
function geoLongitude(name,T){const p=heliocentricXYZ(name,T),g=heliocentricXYZ('Earth',T);return mod360(toDeg(Math.atan2(p.y-g.y,p.x-g.x))+1.3969713*T+0.0003086*T*T);}
// Black Moon Lilith — mean lunar apogee (perigee series + 180°)
function meanLilith(T){return mod360(83.3532465+4069.0137287*T-0.0103200*T*T+180);}
function northNode(T){return mod360(125.0445479-1934.1362608*T+0.0020762*T*T);}
// Positions depend only on the instant, so cache by Julian Day — the
// eight-tone scan, applying-aspect probes and retrograde probes all share it.
const EPHEM_CACHE=new Map();
function computePlanets(jd){
  const key=Math.round(jd*1e6);
  const hit=EPHEM_CACHE.get(key); if(hit)return hit;
  const T=julianCenturies(jd);
  const out={Sun:sunLongitude(T),Moon:moonLongitude(T),
    Mercury:geoLongitude('Mercury',T),Venus:geoLongitude('Venus',T),Mars:geoLongitude('Mars',T),
    Jupiter:geoLongitude('Jupiter',T),Saturn:geoLongitude('Saturn',T),Uranus:geoLongitude('Uranus',T),
    Neptune:geoLongitude('Neptune',T),Pluto:geoLongitude('Pluto',T),
    Lilith:meanLilith(T),NorthNode:northNode(T)};
  if(EPHEM_CACHE.size>50000)EPHEM_CACHE.clear();
  EPHEM_CACHE.set(key,out);
  return out;
}
function ascendant(jd,lat,lng){const T=julianCenturies(jd);let GMST=280.46061837+360.98564736629*(jd-2451545)+0.000387933*T*T-T*T*T/38710000;const RAMC=toRad(mod360(GMST+lng)),latR=toRad(lat),e=toRad(23.4392911);return mod360(toDeg(Math.atan2(-Math.cos(RAMC),Math.sin(e)*Math.tan(latR)+Math.cos(e)*Math.sin(RAMC))));}
function houseOf(lon,asc){return Math.floor(mod360(lon-asc)/30)+1;}
function signOf(lon){return SIGNS[Math.floor(lon/30)];}

const DIGNITY={
  Sun:{domicile:['Leo'],exaltation:['Aries'],detriment:['Aquarius'],fall:['Libra']},
  Moon:{domicile:['Cancer'],exaltation:['Taurus'],detriment:['Capricorn'],fall:['Scorpio']},
  Mercury:{domicile:['Gemini','Virgo'],exaltation:['Virgo'],detriment:['Sagittarius','Pisces'],fall:['Pisces']},
  Venus:{domicile:['Taurus','Libra'],exaltation:['Pisces'],detriment:['Aries','Scorpio'],fall:['Virgo']},
  Mars:{domicile:['Aries','Scorpio'],exaltation:['Capricorn'],detriment:['Libra','Taurus'],fall:['Cancer']},
  Jupiter:{domicile:['Sagittarius','Pisces'],exaltation:['Cancer'],detriment:['Gemini','Virgo'],fall:['Capricorn']},
  Saturn:{domicile:['Capricorn','Aquarius'],exaltation:['Libra'],detriment:['Cancer','Leo'],fall:['Aries']},
};
function dignityOf(planet,lon){const s=signOf(lon),d=DIGNITY[planet];if(!d)return{label:'Neutral',mod:1};if(d.domicile?.includes(s))return{label:'Domicile',mod:1.4};if(d.exaltation?.includes(s))return{label:'Exaltation',mod:1.25};if(d.detriment?.includes(s))return{label:'Detriment',mod:0.7};if(d.fall?.includes(s))return{label:'Fall',mod:0.75};return{label:'Peregrine',mod:1};}

const ASPECTS=[

function findAspect(lonA,lonB,orbScale=1){const diff=Math.abs(lonA-lonB)%360,sep=diff>180?360-diff:diff;for(const asp of ASPECTS){const cap=asp.orbMax*orbScale,orb=Math.abs(sep-asp.angle);if(orb<=cap)return{...asp,orb:parseFloat(orb.toFixed(2)),orbRatio:orb/cap};}return null;}
function orbFactor(r){return Math.cos(r*Math.PI/2);}

const ORB_SCALE={Sun:1,Moon:1,Mercury:0.9,Venus:0.95,Mars:0.95,Jupiter:0.85,Saturn:0.85,Uranus:0.75,Neptune:0.75,Pluto:0.75,Lilith:0.55,NorthNode:0.6,Asc:0.8};
function aspectBetween(nameA,lonA,nameB,lonB){return findAspect(lonA,lonB,Math.min(ORB_SCALE[nameA]??0.85,ORB_SCALE[nameB]??0.85));}
function angularSep(a,b){const d=Math.abs(a-b)%360;return d>180?360-d:d;}
// Shorter-arc midpoint of two zodiacal points
function midpoint(a,b){const d=mod360(b-a);return d<=180?mod360(a+d/2):mod360(b+mod360(a-b)/2);}

function computeRetrogrades(jd) {
  const before = computePlanets(jd - 0.5), after = computePlanets(jd + 0.5), rx = {};
  for (const p of ['Mercury','Venus','Mars','Jupiter','Saturn','Uranus','Neptune','Pluto']) {
    let d = after[p] - before[p];
    if (d > 180) d -= 360;
    if (d < -180) d += 360;
    rx[p] = d < 0;
  }
  return rx;
}

// Aspects that are perfecting (applying) carry more charge than those
// already separating. Probe the transiting body a fraction of a day ahead.
function applyingFactor(jd, tName, tLon, targetLon, asp) {
  const later = computePlanets(jd + 0.04)[tName];
  if (later === undefined) return 1;
  const dNow   = Math.abs(angularSep(tLon,  targetLon) - asp.angle);
  const dLater = Math.abs(angularSep(later, targetLon) - asp.angle);
  if (dLater < dNow - 1e-4) return 1.12;
  if (dLater > dNow + 1e-4) return 0.88;
  return 1;
}

function moonPhase(sunLon, moonLon) {
  const elong = mod360(moonLon - sunLon);
  const illum = (1 - Math.cos(toRad(elong))) / 2;
  const names = ['New','Waxing Crescent','First Quarter','Waxing Gibbous','Full','Waning Gibbous','Last Quarter','Waning Crescent'];
  return { elong, illum, waxing: elong < 180, name: names[Math.floor(mod360(elong + 22.5) / 45)] };
}

// True void-of-course: the Moon perfects no Ptolemaic aspect to any planet
// before leaving its sign. Planets are treated as fixed over the Moon's
// remaining arc — they drift well under the orb tolerance in that window.
function voidOfCourse(trans) {
  const remaining = 30 - (trans.Moon % 30);
  for (const b of ['Sun','Mercury','Venus','Mars','Jupiter','Saturn','Uranus','Neptune','Pluto']) {
    for (const ang of [0, 60, 90, 120, 180]) {
      for (const s of (ang === 0 || ang === 180 ? [1] : [1, -1])) {
        const delta = mod360(trans[b] + s * ang - trans.Moon);
        if (delta > 1e-6 && delta <= remaining) return false;
      }
    }
  }
  return true;
}

const EROTIC_BODIES = ['Venus','Mars','Pluto','Lilith'];
// How much an aspect's geometry contributes. Friction between erotic bodies
// is never zeroed out — a Venus–Mars square carries heat in any tone.
function qualityWeight(asp, nameA, nameB, W) {
  const q = asp.quality;
  if (q === 'fusion')  return W.conjBonus;
  if (q === 'harmony') return 1;
  if (q === 'ease')    return 0.75;
  if (q === 'tension' || q === 'friction') {
    const erotic = EROTIC_BODIES.includes(nameA) && EROTIC_BODIES.includes(nameB);
    if (TONE.t3 === 'tension') return erotic ? 0.8 : 0.5;
    return erotic ? 0.35 : 0;
  }
  return 0.2; // quincunx — the itch of near-miss
}

  // midpoints. Midpoints answer only to tight orbs (2.5° axis, 1.5° square).

    const catPts=r1(Math.min(pts,10)); grandTotal+=catPts;

    const vSign=signOf(trans.Venus), mSign=signOf(trans.Mars);

      if (a&&(a.quality==='tension'||a.quality==='friction')) {

      }

    const nv=aspectBetween('Neptune',trans.Neptune,'Venus',trans.Venus);
    if (nv && ['fusion','harmony','ease'].includes(nv.quality)) {

    const catPts=r1(Math.min(pts,10)); grandTotal+=catPts;
    categories.push({name:'VI · Sky Conditions & Dignity',points:catPts,maxPoints:10,items});
  }

  // ── CAT 7: Retrograde Flags ──────────────────────────────────
  {
    const items = [];
    const rxPlanets = [

}

function localToUtcH(hour, min, ampm, utcOffset) {
  let h24 = hour % 12;
  if (ampm === 'PM') h24 += 12;
  return h24 - utcOffset;
}

function computeNatals() {
  const wUtcH = localToUtcH(BIRTH.wHour, BIRTH.wMin, BIRTH.wAmpm, BIRTH.wUtcOffset);

  const mJD = jdn(BIRTH.mYear, BIRTH.mMonth, BIRTH.mDay, mUtcH, BIRTH.mMin);
  // Copy before attaching the Ascendant — computePlanets returns cached objects.
  return {
    wNatal: { ...computePlanets(wJD), Asc: ascendant(wJD, BIRTH.wLat, BIRTH.wLng) },
    mNatal: { ...computePlanets(mJD), Asc: ascendant(mJD, BIRTH.mLat, BIRTH.mLng) },

}

const PROXY = 'https://corsproxy.io/?';

async function fetchWithFallback(url, options) {
  try {
    const res = await fetch(url, options);
    if (res.ok) return res;
  } catch(e) { }
  const proxyUrl = PROXY + encodeURIComponent(url);
  const res = await fetch(proxyUrl, options);
  if (!res.ok) throw new Error(`HTTP ${res.status} from ${url}`);
  return res;
}

async function geocodeCity(cityStr) {
  const url = `https://nominatim.openstreetmap.org/search?q=${encodeURIComponent(cityStr)}&format=json&limit=1`;
  const res = await fetchWithFallback(url, { headers: { 'Accept-Language': 'en' } });
  const data = await res.json();
  if (!data.length) throw new Error(`Could not find "${cityStr}" — try a more specific name (e.g. "Portland, Maine, USA")`);
  return { lat: parseFloat(data[0].lat), lng: parseFloat(data[0].lon), displayName: data[0].display_name };
}

async function getUtcOffset(lat, lng, year, month, day) {
  const tzUrl = `https://timeapi.io/api/timezone/coordinate?latitude=${lat}&longitude=${lng}`;
  const tzRes = await fetchWithFallback(tzUrl, {});
  const tzData = await tzRes.json();
  const tz = tzData.timeZone;
  const dateStr = `${year}-${String(month).padStart(2,'0')}-${String(day).padStart(2,'0')}`;
  const convRes = await fetchWithFallback(`https://timeapi.io/api/conversion/converttimezone`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ fromTimeZone: tz, dateTime: `${dateStr} 12:00:00`, toTimeZone: 'UTC', dstAmbiguity: '' })
  });
  const convData = await convRes.json();
  if (!convData || !convData.conversionResult || !convData.conversionResult.dateTime)
    throw new Error(`Time-zone lookup failed for ${tz}`);
  // Compare both instants in UTC so the result does not depend on the viewer's own time zone.
  const localNoon = new Date(`${dateStr}T12:00:00Z`);
  const utcNoon   = new Date(convData.conversionResult.dateTime + 'Z');
  const offsetHours = (localNoon - utcNoon) / 3600000;
  return { offset: offsetHours, timezone: tz };
}

async function applyBirth() {
  const btn = document.getElementById('birthSubmitBtn');
  const errEl = document.getElementById('birthError');
  btn.textContent = 'Looking up locations…'; btn.disabled = true;
  errEl.style.display = 'none';

  const g = (id) => document.getElementById(id);

  try {
    const wCity = g('wCity').value.trim();
    const mCity = g('mCity').value.trim();
    const wYear=+g('wYear').value, wMonth=+g('wMonth').value, wDay=+g('wDay').value;
    const mYear=+g('mYear').value, mMonth=+g('mMonth').value, mDay=+g('mDay').value;

    btn.textContent = 'Geocoding cities…';

    async function resolveGeo(city, statusId) {
      const manualLat = parseFloat(document.getElementById(statusId.replace('GeoStatus','ManualLat'))?.value);
      const manualLng = parseFloat(document.getElementById(statusId.replace('GeoStatus','ManualLng'))?.value);
      if (!isNaN(manualLat) && !isNaN(manualLng)) return { lat:manualLat, lng:manualLng, displayName:city, manual:true };
      const geo = await geocodeCity(city);
      document.getElementById(statusId).textContent = `Found: ${geo.displayName.split(',').slice(0,3).join(',')} · ${geo.lat.toFixed(4)}°, ${geo.lng.toFixed(4)}°`;
      return geo;
    }

    async function resolveOffset(geo, year, month, day, statusId) {
      const manualEl = document.getElementById(statusId.replace('GeoStatus','ManualOffset'));
      if (manualEl && manualEl.value !== '') {
        const off = parseFloat(manualEl.value);
        document.getElementById(statusId).textContent += ` · manual UTC${off>=0?'+':''}${off}`;
        return { offset:off, timezone:'manual' };
      }
      const tz = await getUtcOffset(geo.lat, geo.lng, year, month, day);
      document.getElementById(statusId).textContent += ` · ${tz.timezone} (UTC${tz.offset>=0?'+':''}${tz.offset})`;
      return tz;
    }

    const [wGeo, mGeo] = await Promise.all([resolveGeo(wCity,'wGeoStatus'), resolveGeo(mCity,'mGeoStatus')]);

    btn.textContent = 'Looking up time zones…';
    const [wTz, mTz] = await Promise.all([
      resolveOffset(wGeo, wYear, wMonth, wDay, 'wGeoStatus'),
      resolveOffset(mGeo, mYear, mMonth, mDay, 'mGeoStatus'),
    ]);

    BIRTH.wYear=wYear; BIRTH.wMonth=wMonth; BIRTH.wDay=wDay;
    BIRTH.wHour=+g('wHour').value; BIRTH.wMin=+g('wMin').value; BIRTH.wAmpm=g('wAmpm').value;
    BIRTH.wCity=wCity; BIRTH.wLat=wGeo.lat; BIRTH.wLng=wGeo.lng; BIRTH.wUtcOffset=wTz.offset;
    BIRTH.mYear=mYear; BIRTH.mMonth=mMonth; BIRTH.mDay=mDay;
    BIRTH.mHour=+g('mHour').value; BIRTH.mMin=+g('mMin').value; BIRTH.mAmpm=g('mAmpm').value;
    BIRTH.mCity=mCity; BIRTH.mLat=mGeo.lat; BIRTH.mLng=mGeo.lng; BIRTH.mUtcOffset=mTz.offset;

    const natals = computeNatals();
    wNatal = natals.wNatal; mNatal = natals.mNatal;

    btn.textContent = 'Done — recalculating…';
    render();

// Julian Day at 00:00 UTC of today — the search window always starts from the
// current date. Computed from the Unix epoch (not jdn(), which is off by one in
// Jan/Feb) so it stays correct whenever the page is loaded.
function currentBaseJD() {
  return Math.floor(Date.now() / 86400000) + 2440587.5;
}

function findBest() {
  const BASE=currentBaseJD();
  let best={total:-Infinity}, bestTone=null;
  // Scan every date/hour under each of the eight tones; the optimal moment is
  // the single highest score regardless of tone.
  for (const tc of TONE_COMBOS) {
    TONE.t1=tc.t1; TONE.t2=tc.t2; TONE.t3=tc.t3;
    for (let d=0;d<60;d++) {
      // Local evening hours 5–9 PM (PDT = UTC−7), converted to UTC for the ephemeris.
      for (let h=17;h<=21;h++) {
        const jd=BASE+d+(h+7)/24;
        const result=scoreDateTime(jd,wNatal,mNatal,BIRTH.wLat,BIRTH.wLng);
        if (result.total>best.total){best=result;best.jd=jd;bestTone={t1:tc.t1,t2:tc.t2,t3:tc.t3};}
      }
    }
  }
  // Pin the global tone to the winning combination so the whole reading
  // (score breakdown, houses, verdict, charts) reflects that peak moment.
  TONE.t1=bestTone.t1; TONE.t2=bestTone.t2; TONE.t3=bestTone.t3;
  // Refine the winning hour to 10-minute resolution under the winning tone —
  // the Moon and Ascendant move fast enough for minutes to matter.
  const centerJD = best.jd;
  for (let step=-6; step<=6; step++) {
    const jd = centerJD + step/144;
    const r = scoreDateTime(jd, wNatal, mNatal, BIRTH.wLat, BIRTH.wLng);
    if (r.total > best.total) { best = r; best.jd = jd; }
  }
  best.tone=bestTone;
  return best;
}

function jdToDate(jd){const z=Math.floor(jd+0.5),f=jd+0.5-z;let A=z;if(z>=2299161){const a=Math.floor((z-1867216.25)/36524.25);A=z+1+a-Math.floor(a/4);}const B=A+1524,C=Math.floor((B-122.1)/365.25),D=Math.floor(365.25*C),E=Math.floor((B-D)/30.6001);const month=E<14?E-1:E-13;return{day:B-D-Math.floor(30.6001*E),month,year:month>2?C-4716:C-4715,hour:Math.floor(f*24),min:Math.floor(((f*24)%1)*60)};}
const MONTHS=['','January','February','March','April','May','June','July','August','September','October','November','December'];
const WEEKDAYS=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
function fmtTime(localH,m){return`${localH%12||12}:${String(m).padStart(2,'0')} ${localH>=12?'PM':'AM'} PDT`;}
function formatPos(lon){const d=Math.floor(lon%30),m=Math.floor((lon%1)*60);return`${d}°${m}′ ${SIGNS[Math.floor(lon/30)]}`;}

  const catHtml=result.categories.map(cat=>{
    const itemsHtml=cat.items.map(item=>{
      const cls=item.pts>0?'pos':item.pts<0?'neg':'zero';
      const bw=item.max>0?Math.max(0,Math.min(100,item.pts/item.max*100)):0;
      const bc=item.pts>=0?'#81c784':'#ef9a9a';

    return`<div class="score-cat">

    if (tmv && ['fusion','harmony','ease'].includes(tmv.quality)) drawIn += 10 * orbFactor(tmv.orbRatio);

  }

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>

<script>
// ═══════════════════════════════════════════════════════════════
// ALL-TONES LINE CHART
// ═══════════════════════════════════════════════════════════════

var allTonesTimer = null;
// TONE_COMBOS and toneComboLabel() are defined in the first script block.

var TONE_COLORS = [
  '#c0392b','#e74c3c','#e67e22','#f39c12',
  '#2980b9','#8e44ad','#27ae60','#1abc9c',
];

function startAllTonesChart() {
  if (allTonesTimer) clearTimeout(allTonesTimer);

  var canvasEl = document.getElementById('allTonesDc');
  if (!canvasEl) return;
  var oldChart = Chart.getChart(canvasEl);
  if (oldChart) oldChart.destroy();

  function scoreForTone(jd, tc) {
    var saved = {t1:TONE.t1, t2:TONE.t2, t3:TONE.t3};
    TONE.t1 = tc.t1; TONE.t2 = tc.t2; TONE.t3 = tc.t3;
    var res = scoreDateTime(jd, wNatal, mNatal, BIRTH.wLat, BIRTH.wLng);
    TONE.t1 = saved.t1; TONE.t2 = saved.t2; TONE.t3 = saved.t3;
    return res.total;
  }

  var BASE2 = currentBaseJD();
  var labels = [];
  for (var d=0; d<60; d++) {
    var jd0 = BASE2+d;
    var c = (function(jd){
      var z=Math.floor(jd+0.5),A=z;
      if(z>=2299161){var al=Math.floor((z-1867216.25)/36524.25);A=z+1+al-Math.floor(al/4);}
      var B=A+1524,C=Math.floor((B-122.1)/365.25),D2=Math.floor(365.25*C),E=Math.floor((B-D2)/30.6001),mo=E<14?E-1:E-13;
      return{d:B-D2-Math.floor(30.6001*E),m:mo};
    })(jd0);
    var WD=['Su','Mo','Tu','We','Th','Fr','Sa'],MN=['','Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
    labels.push(WD[Math.floor(jd0+1.5)%7]+' '+MN[c.m]+' '+c.d);
  }

  var datasets = TONE_COMBOS.map(function(tc, i) {
    var isActive = (tc.t1===TONE.t1 && tc.t2===TONE.t2 && tc.t3===TONE.t3);
    return {
      label: toneComboLabel(tc),
      data: [],
      borderColor: TONE_COLORS[i],
      backgroundColor: 'transparent',
      borderWidth: isActive ? 2.5 : 1.2,
      pointRadius: 0,
      pointHoverRadius: 5,
      pointHoverBackgroundColor: TONE_COLORS[i],
      tension: 0.45,
      borderDash: isActive ? [] : [4,3],
      order: isActive ? 0 : 1,
    };
  });

  var axC='rgba(201,168,76,0.25)',grC='rgba(201,168,76,0.08)',lbC='rgba(245,240,232,0.45)';

  var ctx = canvasEl.getContext('2d');
  var chart = new Chart(ctx, {
    type: 'line',
    data: { labels: labels, datasets: datasets },
    options: {
      responsive: true, maintainAspectRatio: false,
      animation: { duration: 0 },
      interaction: { mode: 'index', intersect: false },
      plugins: {
        legend: { display: false },
        tooltip: {
          enabled: false,
          external: function(context) {
            var tooltipEl = document.getElementById('allTonesTooltip');
            if (!tooltipEl) return;
            var tooltip = context.tooltip;
            if (tooltip.opacity === 0) { tooltipEl.innerHTML = ''; return; }
            var date = tooltip.title && tooltip.title[0] ? '<span style="color:#e8d49a;margin-right:12px;font-size:11px;letter-spacing:0.05em">' + tooltip.title[0] + '</span>' : '';
            var items = tooltip.dataPoints ? tooltip.dataPoints.slice().sort(function(a,b){return b.raw-a.raw;}) : [];
            var rows = items.map(function(item) {
              var isActive = TONE_COMBOS[item.datasetIndex].t1===TONE.t1 && TONE_COMBOS[item.datasetIndex].t2===TONE.t2 && TONE_COMBOS[item.datasetIndex].t3===TONE.t3;
              return '<div style="color:'+TONE_COLORS[item.datasetIndex]+';line-height:1.6">' + item.dataset.label + (isActive?' ★':'') + ' <strong style="color:rgba(245,240,232,0.9)">' + item.raw + '</strong></div>';
            }).join('');
            tooltipEl.innerHTML = date + rows;
          }
        }
      },
      scales: {
        x: { ticks:{color:lbC,font:{size:10},maxRotation:55,autoSkip:true,maxTicksLimit:20}, grid:{color:grC}, border:{color:axC} },
        y: { min:0, max:100, ticks:{color:lbC,font:{size:11},stepSize:20}, grid:{color:grC}, border:{color:axC}, title:{display:true,text:'Score / 100',color:lbC,font:{size:11}} }
      },
      onClick: function(evt, elements) {
        var canvasRect = canvasEl.getBoundingClientRect();
        var clickY = evt.native.clientY - canvasRect.top;
        var xIdx = elements.length ? elements[0].index : -1;
        if (xIdx < 0) return;
        var bestDsIdx = 0, bestDist = Infinity;
        for (var di = 0; di < datasets.length; di++) {
          var meta = chart.getDatasetMeta(di);
          if (!meta.data[xIdx]) continue;
          var py = meta.data[xIdx].y;
          var dist = Math.abs(py - clickY);
          if (dist < bestDist) { bestDist = dist; bestDsIdx = di; }
        }
        var tc = TONE_COMBOS[bestDsIdx];
        if (tc.t1===TONE.t1 && tc.t2===TONE.t2 && tc.t3===TONE.t3) return;
        // Selecting a tone re-focuses the chart highlight and the calendar
        // below. The optimal-moment reading stays pinned to the global peak.
        TONE.t1 = tc.t1; TONE.t2 = tc.t2; TONE.t3 = tc.t3;
        var lbl = document.getElementById('calToneLabel');
        if (lbl) lbl.textContent = toneLabel();
        if (window.Chart) startCalChart();
        datasets.forEach(function(ds, i) {
          var isActive = TONE_COMBOS[i].t1===TONE.t1 && TONE_COMBOS[i].t2===TONE.t2 && TONE_COMBOS[i].t3===TONE.t3;
          ds.borderWidth = isActive ? 2.5 : 1.2;
          ds.borderDash  = isActive ? [] : [4,3];
          ds.order       = isActive ? 0 : 1;
        });
        chart.update('none');
        buildLegend();
      },
      onHover: function(evt, elements) {
        evt.native.target.style.cursor = elements.length ? 'pointer' : 'default';
      }
    }
  });

  function buildLegend() {
    var legendEl = document.getElementById('allTonesLegend');
    if (!legendEl) return;
    legendEl.innerHTML = TONE_COMBOS.map(function(tc,i){
      var isActive = tc.t1===TONE.t1 && tc.t2===TONE.t2 && tc.t3===TONE.t3;
      return '<span style="display:flex;align-items:center;gap:5px;opacity:'+(isActive?'1':'0.55')+'">' +
        '<span style="width:18px;height:2px;background:'+TONE_COLORS[i]+';display:inline-block;border-radius:1px'+(isActive?'':';opacity:0.6')+'"></span>' +
        '<span>'+toneComboLabel(tc)+(isActive?' ★':'')+'</span></span>';
    }).join('');
  }
  buildLegend();

  var day = 0;
  function computeAllDay() {
    if (!document.getElementById('allTonesDc')) return;
    if (day >= 60) {
      document.getElementById('allTonesMsg').textContent = 'Hover to see scores · active tone marked ★';
      return;
    }
    var jd0 = BASE2 + day;
    for (var ci = 0; ci < TONE_COMBOS.length; ci++) {
      var best = -1;
      for (var h = 17; h <= 22; h++) {
        var s = scoreForTone(jd0 + (h+7)/24, TONE_COMBOS[ci]);
        if (s > best) best = s;
      }
      datasets[ci].data.push(parseFloat(best.toFixed(1)));
    }
    chart.update('none');
    day++;
    document.getElementById('allTonesMsg').textContent = 'Computing day ' + day + ' of 60…';
    allTonesTimer = setTimeout(computeAllDay, 0);
  }

  allTonesTimer = setTimeout(computeAllDay, 50);
}

// ═══════════════════════════════════════════════════════════════
// STACKED CALENDAR CHART
// ═══════════════════════════════════════════════════════════════
var calTimer = null;

function startCalChart() {
  if (calTimer) clearTimeout(calTimer);
  var hs = document.getElementById('calHs');
  if (hs) hs.style.display = 'none';

  var synFixed = (function(){
    var r = natalSynastryItems(wNatal, mNatal, toneWeights());
    return parseFloat(Math.min(r.pts, 15).toFixed(1));
  })();

  function score3(jd){
    var res = scoreDateTime(jd, wNatal, mNatal, BIRTH.wLat, BIRTH.wLng);
    var personal=0, sky=0;
    for (var ci=0; ci<res.categories.length; ci++) {
      var cat = res.categories[ci];
      if (cat.name.indexOf('III ·')===0 || cat.name.indexOf('VII ·')===0) continue;
      for (var ii=0; ii<cat.items.length; ii++) {
        var item = cat.items[ii];
        if (item.pts <= 0) {
          if (item.isUniversal === false) personal += item.pts;
          else sky += item.pts;
        } else {
          if (item.isUniversal === false) personal += item.pts;
          else if (item.isUniversal === true) sky += item.pts;
        }
      }
    }
    personal = parseFloat(Math.min(Math.max(personal, 0), 75).toFixed(1));
    var skyAdj = parseFloat(Math.max(sky, 0).toFixed(1));
    if (sky < 0) { personal = parseFloat(Math.max(personal + sky, 0).toFixed(1)); skyAdj = 0; }
    return{personal:personal, sky:skyAdj, natal:synFixed, total:res.total};
  }

  function jdCal(jd){var z=Math.floor(jd+0.5),A=z;if(z>=2299161){var al=Math.floor((z-1867216.25)/36524.25);A=z+1+al-Math.floor(al/4);}var B=A+1524,C=Math.floor((B-122.1)/365.25),D2=Math.floor(365.25*C),E=Math.floor((B-D2)/30.6001),mo=E<14?E-1:E-13;return{d:B-D2-Math.floor(30.6001*E),m:mo};}
  var WD2=['Su','Mo','Tu','We','Th','Fr','Sa'],MN3=['','Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  function lbl2(jd){var c=jdCal(jd);return WD2[Math.floor(jd+1.5)%7]+' '+MN3[c.m]+' '+c.d;}
  function lblFull2(jd){var c=jdCal(jd);return MN3[c.m]+' '+c.d+', 2026';}

  var C_NATAL='#5c6bc0',C_SKY='#8d6e63',C_PERS='#c9a84c';
  var axC='rgba(201,168,76,0.25)',grC='rgba(201,168,76,0.08)',lbC='rgba(245,240,232,0.45)';

  var BASE2=currentBaseJD();
  var cData={labels:[],datasets:[
    {label:'Natal synastry baseline',data:[],backgroundColor:C_NATAL,borderWidth:0,stack:'s'},
    {label:'Sky conditions & dignity',data:[],backgroundColor:C_SKY,borderWidth:0,stack:'s'},
    {label:'Personal transits',data:[],backgroundColor:C_PERS,borderWidth:0,stack:'s'}
  ]};
  var djds2=[],tips2=[],hChart2=null;

  var canvasEl=document.getElementById('calDc');
  if(!canvasEl)return;
  var oldChart=Chart.getChart(canvasEl);
  if(oldChart)oldChart.destroy();

  var ctx2=canvasEl.getContext('2d');
  var dChart2=new Chart(ctx2,{
    type:'bar',data:cData,
    options:{
      responsive:true,maintainAspectRatio:false,animation:{duration:200},
      plugins:{
        legend:{display:false},
        tooltip:{
          callbacks:{
            title:function(i){return cData.labels[i[0].dataIndex];},
            afterTitle:function(i){var t=tips2[i[0].dataIndex];return t?'Total: '+t.total+' / 100':'';},
            label:function(item){var t=tips2[item.dataIndex];if(!t)return'';if(item.datasetIndex===0)return' Natal baseline: '+t.natal;if(item.datasetIndex===1)return' Sky conditions: '+t.sky;return' Personal transits: '+t.personal;},
            footer:function(){return'Click for hourly breakdown';}
          },
          backgroundColor:'rgba(10,8,18,0.92)',titleColor:'#e8d49a',bodyColor:'rgba(245,240,232,0.75)',footerColor:'rgba(245,240,232,0.35)',borderColor:'rgba(201,168,76,0.3)',borderWidth:1,footerFont:{size:10}
        }
      },
      scales:{
        x:{stacked:true,ticks:{color:lbC,font:{size:10},maxRotation:55,autoSkip:true,maxTicksLimit:20},grid:{color:grC},border:{color:axC}},
        y:{stacked:true,min:0,max:100,ticks:{color:lbC,font:{size:11},stepSize:20},grid:{color:grC},border:{color:axC},title:{display:true,text:'Score / 100',color:lbC,font:{size:11}}}
      },
      onClick:function(evt,els){if(!els.length)return;showCalHourly(djds2[els[0].index]);},
      onHover:function(evt,els){evt.native.target.style.cursor=els.length?'pointer':'default';}
    }
  });

  var calDay=0;
  function computeCalDay(){
    if(!document.getElementById('calDc')){return;}
    if(calDay>=60){document.getElementById('calMsg').textContent='Click any bar for hourly breakdown · tone: '+toneLabel();return;}
    var jd0=BASE2+calDay,best=null;
    for(var h=17;h<=22;h++){var s=score3(jd0+(h+7)/24);if(!best||s.total>best.total)best=s;}
    cData.labels.push(lbl2(jd0));
    cData.datasets[0].data.push(best.natal);
    cData.datasets[1].data.push(best.sky);
    cData.datasets[2].data.push(best.personal);
    djds2.push(jd0);tips2.push(best);
    dChart2.update('active');
    calDay++;
    document.getElementById('calMsg').textContent='Computing day '+calDay+' of 60…';
    calTimer=setTimeout(computeCalDay,0);
  }

  function showCalHourly(baseJD){
    var hs=document.getElementById('calHs');
    document.getElementById('calHt').textContent='Hourly · '+lblFull2(baseJD);
    hs.style.display='block';
    var hl=[],hN=[],hS=[],hP=[],hT=[],bestTotal=-1,bestH=-1;
    for(var lh=7;lh<=22;lh++){
      var utcH=lh+7,dayOff=utcH>=24?1:0,jd=baseJD+dayOff+(utcH%24)/24,s=score3(jd);
      hl.push(lh===12?'12pm':lh>12?(lh-12)+'pm':lh+'am');
      hN.push(s.natal);hS.push(s.sky);hP.push(s.personal);hT.push(s);
      if(s.total>bestTotal){bestTotal=s.total;bestH=lh;}
    }
    var bStr=bestH===12?'12:00 PM':bestH>12?(bestH-12)+':00 PM':bestH+':00 AM';
    document.getElementById('calHb').innerHTML='Best hour: <strong style="color:var(--gold-light)">'+bStr+' PDT</strong> &nbsp;·&nbsp; Total score <strong style="color:var(--gold-light)">'+bestTotal+'</strong>';
    var hCtx=document.getElementById('calHc').getContext('2d');
    var existingHourly=Chart.getChart(document.getElementById('calHc'));
    if(existingHourly)existingHourly.destroy();
    hChart2=new Chart(hCtx,{
      type:'bar',
      data:{labels:hl,datasets:[
        {label:'Natal',data:hN,backgroundColor:C_NATAL,borderWidth:0,stack:'s'},
        {label:'Sky',data:hS,backgroundColor:C_SKY,borderWidth:0,stack:'s'},
        {label:'Personal',data:hP,backgroundColor:C_PERS,borderWidth:0,stack:'s'}
      ]},
      options:{
        responsive:true,maintainAspectRatio:false,
        plugins:{legend:{display:false},tooltip:{callbacks:{title:function(i){return hl[i[0].dataIndex];},afterTitle:function(i){var t=hT[i[0].dataIndex];return'Total: '+t.total+' / 100';},label:function(item){var t=hT[item.dataIndex];if(!t)return'';if(item.datasetIndex===0)return' Natal: '+t.natal;if(item.datasetIndex===1)return' Sky: '+t.sky;return' Personal: '+t.personal;}},backgroundColor:'rgba(10,8,18,0.92)',titleColor:'#e8d49a',bodyColor:'rgba(245,240,232,0.75)',borderColor:'rgba(201,168,76,0.3)',borderWidth:1}},
        scales:{
          x:{stacked:true,ticks:{color:lbC,font:{size:10},maxRotation:45,autoSkip:false},grid:{color:grC},border:{color:axC}},
          y:{stacked:true,min:0,max:100,ticks:{color:lbC,font:{size:11},stepSize:20},grid:{color:grC},border:{color:axC},title:{display:true,text:'Score / 100',color:lbC,font:{size:11}}}
        }
      }
    });
    hs.scrollIntoView({behavior:'smooth',block:'nearest'});
  }

  calTimer=setTimeout(computeCalDay,50);
}

setTimeout(startCalChart, 300);
setTimeout(startAllTonesChart, 400);
setTimeout(startPolarityChart, 500);

// ═══════════════════════════════════════════════════════════════
// POLARITY TRACKER
// ═══════════════════════════════════════════════════════════════

var polarityTimer = null;

function startPolarityChart() {
  if (polarityTimer) clearTimeout(polarityTimer);

  var canvas = document.getElementById('polarityCanvas');
  if (!canvas) return;

  var DAYS = 60;
  var BASE2 = currentBaseJD();

  function polScore(jd, natalChart, otherNatal) {
    var tr = computePlanets(jd);
    var drawIn=0, moveOut=0;
    var a1=findAspect(tr.Mars, natalChart.Venus);
    if(a1&&['fusion','harmony','ease'].indexOf(a1.quality)>=0) drawIn+=10*orbFactor(a1.orbRatio);
    var a2=findAspect(tr.Venus, natalChart.Mars);
    if(a2&&['fusion','harmony','ease'].indexOf(a2.quality)>=0) moveOut+=10*orbFactor(a2.orbRatio);
    drawIn += (dignityOf('Venus', natalChart.Venus).mod - 1) * 8;
    moveOut += (dignityOf('Mars', natalChart.Mars).mod - 1) * 8;
    var a3=findAspect(natalChart.Venus, otherNatal.Mars);
    if(a3&&['fusion','harmony','ease'].indexOf(a3.quality)>=0) drawIn+=5*orbFactor(a3.orbRatio);
    var a4=findAspect(natalChart.Mars, otherNatal.Venus);
    if(a4&&['fusion','harmony','ease'].indexOf(a4.quality)>=0) moveOut+=5*orbFactor(a4.orbRatio);
    return {drawIn:drawIn, moveOut:moveOut};
  }

  function polarityRole(pol) {
    var diff = pol.drawIn - pol.moveOut;
    if (Math.abs(diff) < 1.5) return 'balanced';
    return diff > 0 ? 'drawing' : 'moving';
  }

  function roleColor(role, alpha) {
    if (role==='drawing')  return 'rgba(100,181,246,'+alpha+')';
    if (role==='moving')   return 'rgba(229,115,115,'+alpha+')';
    return 'rgba(245,240,232,0.12)';
  }

  function jdCal(jd){var z=Math.floor(jd+0.5),A=z;if(z>=2299161){var al=Math.floor((z-1867216.25)/36524.25);A=z+1+al-Math.floor(al/4);}var B=A+1524,C=Math.floor((B-122.1)/365.25),D2=Math.floor(365.25*C),E=Math.floor((B-D2)/30.6001),mo=E<14?E-1:E-13;return{d:B-D2-Math.floor(30.6001*E),m:mo};}
  var MN4=['','Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  var WD4=['Su','Mo','Tu','We','Th','Fr','Sa'];
  function dayLabel(jd){var c=jdCal(jd);return WD4[Math.floor(jd+1.5)%7]+' '+MN4[c.m]+' '+c.d;}

  var legendNote = document.getElementById('polarityLegendNote');
  if (legendNote) {
    if (P._useGendered) {
      legendNote.textContent = 'When she draws in and he moves toward — or vice versa — the polarity is complementary.';
    } else {
      legendNote.textContent = 'When one draws in while the other moves toward, the polarity is complementary.';
    }
  }

  var BAND_H = 44;
  var GAP     = 20;
  var LABEL_W = 90;
  var AXIS_H  = 30;
  var TICK_EVERY = 7;

  var totalH = BAND_H*2 + GAP + AXIS_H + 16;
  canvas.height = totalH;
  canvas.style.height = totalH + 'px';

  var data = [];

  function redraw() {
    var W = canvas.offsetWidth || 800;
    canvas.width = W;
    var chartW = W - LABEL_W;
    var dayW = chartW / DAYS;

    var ctx = canvas.getContext('2d');
    ctx.clearRect(0, 0, W, totalH);

    var bands = [
      { y:8,            label: P._useGendered ? P.w.sub   : P.w.name, natal: wNatal, other: mNatal, key:'w' },
      { y:8+BAND_H+GAP, label: P._useGendered ? P.m.sub   : P.m.name, natal: mNatal, other: wNatal, key:'m' },
    ];

    for (var bi=0; bi<bands.length; bi++) {
      var band = bands[bi];
      var by = band.y;

      ctx.fillStyle = 'rgba(255,255,255,0.04)';
      ctx.strokeStyle = 'rgba(201,168,76,0.15)';
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.roundRect ? ctx.roundRect(LABEL_W, by, chartW, BAND_H, 3) : ctx.rect(LABEL_W, by, chartW, BAND_H);
      ctx.fill(); ctx.stroke();

      ctx.fillStyle = 'rgba(232,212,154,0.7)';
      ctx.font = '11px "Cinzel", serif';
      ctx.textAlign = 'right';
      ctx.textBaseline = 'middle';
      ctx.fillText(band.label.split(' (')[0].split(' ').slice(0,2).join(' '), LABEL_W-8, by+BAND_H/2);

      for (var di=0; di<data.length; di++) {
        var day = data[di];
        var role = band.key==='w' ? day.wRole : day.mRole;
        var pol  = band.key==='w' ? day.wPol  : day.mPol;
        var x = LABEL_W + di*dayW;

        ctx.fillStyle = roleColor(role, 0.75);
        ctx.fillRect(x+0.5, by+1, dayW-1, BAND_H-2);

        var intensity = role==='drawing' ? pol.drawIn : role==='moving' ? pol.moveOut : 0;
        var stripeH = Math.max(0, Math.min(BAND_H-2, (intensity/20) * (BAND_H-2)));
        ctx.fillStyle = roleColor(role, 0.35);
        ctx.fillRect(x+0.5, by+1, dayW-1, stripeH);
      }

      ctx.strokeStyle = 'rgba(201,168,76,0.2)';
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(LABEL_W, by); ctx.lineTo(W, by);
      ctx.moveTo(LABEL_W, by+BAND_H); ctx.lineTo(W, by+BAND_H);
      ctx.stroke();
    }

    var axisY = 8 + BAND_H*2 + GAP + 8;
    ctx.fillStyle = 'rgba(245,240,232,0.35)';
    ctx.font = '9px "Cinzel", serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'top';
    for (var di2=0; di2<data.length; di2+=TICK_EVERY) {
      var x2 = LABEL_W + di2*dayW + dayW/2;
      ctx.fillStyle = 'rgba(201,168,76,0.3)';
      ctx.fillRect(x2, 8, 1, BAND_H*2+GAP);
      ctx.fillStyle = 'rgba(245,240,232,0.35)';
      ctx.fillText(data[di2].label, x2, axisY);
    }
  }

  canvas.onmousemove = function(evt) {
    var rect = canvas.getBoundingClientRect();
    var mx = evt.clientX - rect.left;
    var W = canvas.offsetWidth || 800;
    var chartW = W - LABEL_W;
    var dayW = chartW / DAYS;
    var di = Math.floor((mx - LABEL_W) / dayW);
    if (di < 0 || di >= data.length) {
      document.getElementById('polarityTooltip').style.display='none';
      return;
    }
    var day = data[di];
    var tip = document.getElementById('polarityTooltip');
    tip.style.display = 'block';
    tip.innerHTML =
      '<span style="color:#e8d49a;font-size:11px;letter-spacing:0.05em">' + day.label + '</span><br>' +
      '<span style="color:'+roleColor(day.wRole,1)+'">' + (P._useGendered ? P.w.sub : P.w.name) + ': ' +
        (day.wRole==='drawing'?'drawing in':day.wRole==='moving'?'moving toward':'balanced') +
        ' (' + Math.abs(day.wPol.drawIn-day.wPol.moveOut).toFixed(1) + ')' +
      '</span>' +
      '<span style="color:rgba(245,240,232,0.3)"> · </span>' +
      '<span style="color:'+roleColor(day.mRole,1)+'">' + (P._useGendered ? P.m.sub : P.m.name) + ': ' +
        (day.mRole==='drawing'?'drawing in':day.mRole==='moving'?'moving toward':'balanced') +
        ' (' + Math.abs(day.mPol.drawIn-day.mPol.moveOut).toFixed(1) + ')' +
      '</span>';
  };
  canvas.onmouseleave = function() {
    document.getElementById('polarityTooltip').style.display='none';
  };

  var day=0;
  function computeDay(){
    if(!document.getElementById('polarityCanvas'))return;
    if(day>=DAYS){
      document.getElementById('polarityMsg').textContent='Hover for daily detail.';
      redraw();
      return;
    }
    var jd0 = BASE2+day;
    var jd = jd0 + 19/24;
    var wPol = polScore(jd, wNatal, mNatal);
    var mPol = polScore(jd, mNatal, wNatal);
    data.push({
      jd: jd0, label: dayLabel(jd0),
      wRole: polarityRole(wPol), mRole: polarityRole(mPol),
      wPol: wPol, mPol: mPol
    });
    redraw();
    day++;
    document.getElementById('polarityMsg').textContent='Computing day '+day+' of '+DAYS+'…';
    polarityTimer = setTimeout(computeDay, 0);
  }

  window.addEventListener('resize', redraw);

  polarityTimer = setTimeout(computeDay, 50);
}
</script>
